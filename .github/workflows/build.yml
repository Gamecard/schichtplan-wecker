# Prüft jeden Push: Web-Tests, Android-Lint, Debug-Build.
# Bei einem Versions-Tag (z. B. v1.5) zusätzlich: signierte Release-APK bauen und als
# GitHub-Release veröffentlichen. Dafür nötige Secrets (Repo → Settings → Secrets → Actions):
#   KEYSTORE_BASE64    base64 des release.jks
#   KEYSTORE_PASSWORD  storePassword
#   KEY_ALIAS          keyAlias
#   KEY_PASSWORD       keyPassword
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Web-Tests
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci && npm test
        working-directory: tests

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Android-SDK-Plattform installieren
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" > /dev/null

      - name: Lint und Debug-Build
        run: ./gradlew lintDebug assembleDebug

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-bericht
          path: app/build/reports/lint-results-debug.html

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Tag muss zur App-Version passen
        run: |
          VERSION=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu versionName $VERSION"; exit 1
          fi

      - name: Signierschlüssel aus Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 fehlt – ohne Signatur lässt sich die APK nicht als Update installieren"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Android-SDK-Plattform installieren
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" > /dev/null

      - name: Release-APK bauen
        run: ./gradlew assembleRelease

      - name: GitHub-Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Schichtwecker-${GITHUB_REF_NAME#v}.apk"
          gh release create "$GITHUB_REF_NAME" "Schichtwecker-${GITHUB_REF_NAME#v}.apk" \
            --title "Schichtwecker ${GITHUB_REF_NAME#v}" --generate-notes

      - name: Schlüssel entfernen
        if: always()
        run: rm -f release.jks keystore.properties
